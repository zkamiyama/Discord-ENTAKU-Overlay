name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build:exe
      - run: bun run smoke:exe
      - if: matrix.os == 'windows-latest'
        run: bun run package:windows
      - if: matrix.os == 'windows-latest'
        run: bun run verify:package
      - if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: entaku-windows-development
          path: |
            dist/Discord-ENTAKU-Overlay-*-windows-x64.zip
            dist/Discord-ENTAKU-Overlay-*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  browser:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Build portable renderer regression harness
        run: bun build tests/helpers/studio-material-probe.ts --target=browser --outfile=.work/studio-material-probe.js
      - uses: actions/upload-artifact@v4
        with:
          name: entaku-material-regression-harness-${{ matrix.shard }}
          path: .work/studio-material-probe.js
          retention-days: 7
          if-no-files-found: error
      - run: bunx playwright install --with-deps chromium
      - run: bun run build:web
      - run: bunx playwright test --shard=${{ matrix.shard }}/2

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entaku-browser-evidence-${{ matrix.shard }}
          include-hidden-files: true
          path: |
            .work/*.png
            .work/gaussian/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

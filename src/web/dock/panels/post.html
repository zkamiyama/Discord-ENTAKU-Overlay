<details class="pane" id="post-panel"><summary>ポストエフェクト</summary><div id="post-settings"><div id="post-controls"><div class="controls"><button id="post-reset" type="button">初期値に戻す</button></div>
<label><input checked="" id="post-enabled" type="checkbox"/>色調整・Bloom・DoFを有効にする</label><label><input checked="" id="post-exclude" type="checkbox"/>人物・アイコン・名札の印刷面を除外</label><p class="metadata">除外を外すと新しい色調整・Bloom・DoFにも人物を含めます。人物への露出補正、AO・SSR・SSGIは引き続き行いません。</p>
<div class="exposure-grid"><label>自然な彩度（1で変更なし）<input id="post-saturation" max="2" min="0" step="0.02" type="number"/></label><label>コントラスト（1で変更なし）<input id="post-contrast" max="1.5" min="0.5" step="0.02" type="number"/></label></div>
<details open=""><summary>明部のグロー</summary><label><input id="post-bloom" type="checkbox"/>Bloom</label><div class="exposure-grid"><label>しきい値<input id="post-bloom-threshold" max="1.5" min="0" step="0.05" type="number"/></label><label>強さ<input id="post-bloom-strength" max="2" min="0" step="0.05" type="number"/></label><label>広がり<input id="post-bloom-radius" max="1" min="0" step="0.05" type="number"/></label></div><p class="metadata">しきい値は露出補正後の線形輝度です。通常は0〜1で調整します。</p></details>
<details open=""><summary>被写界深度</summary><label><input id="post-dof" type="checkbox"/>DoFで背景をぼかす</label><label>ピントの基準<select id="post-focus-mode"><option value="subject">撮影中の人物</option><option value="behind">人物の少し後ろ</option><option value="manual">距離を固定</option></select></label><div class="exposure-grid"><label>後ろへの距離（m）<input id="post-focus-offset" max="10" min="0" step="0.1" type="number"/></label><label>固定距離（m）<input id="post-focus-distance" max="200" min="0.1" step="0.1" type="number"/></label><label>鮮明な範囲 ±（m）<input id="post-focus-range" max="20" min="0" step="0.1" type="number"/></label><label>ぼけの増え方<input id="post-aperture" max="0.03" min="0" step="0.0005" type="number"/></label><label>最大ぼけ半径（px）<input id="post-max-blur" max="16" min="0" step="0.5" type="number"/></label></div><p class="metadata">2人ショットは両者が鮮明な範囲に入るよう調整します。数値はカメラの奥行き方向です。</p></details>
<label>発話の緑色グローの太さ<input id="post-speech-glow" max="8" min="1" step="0.5" type="number"/></label><p class="metadata">旧版の4倍が標準です。Bloomやポストエフェクトの有効・無効とは独立しています。</p><p class="error" id="post-message" role="status"></p></div></div></details>

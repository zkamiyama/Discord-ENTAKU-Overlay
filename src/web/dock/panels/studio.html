<section class="pane" id="studio-panel"><div class="pane-header"><h2>スタジオ</h2></div><p class="metadata" id="studio-current">標準セット</p><div class="studio-assets"><div class="asset-buttons"><button id="studio-pick" type="button" data-icon="cube" data-label="true" aria-label="GLB/GLTFを読み込む"></button><button id="studio-folder-pick" type="button" data-icon="folder-open" data-label="true" aria-label="フォルダを読み込む"></button></div><input id="studio-files" type="file" multiple hidden aria-label="スタジオGLB・GLTFを選択"><input id="studio-folder" type="file" multiple webkitdirectory hidden aria-label="スタジオのフォルダーを選択"><div class="controls"><button id="studio-reset" type="button" data-icon="arrow-counter-clockwise" data-label="true" aria-label="標準セット"></button></div><p id="studio-feedback" class="metadata" role="status"></p></div>
<details id="studio-mesh-speaker-controls" hidden>
<summary>3Dメッシュアバターの発話グロー</summary>
<p class="hint">取り込んだGLB/GLTFのモデルを参加者へ関連付けると、人物本体の表示をモデルに切り替え、発話中は輪郭が緑色に光ります。モデルの位置はスタジオで設定したままです。</p>
<label>3Dモデル<select id="studio-speaker-model"></select></label>
<label>対応する参加者<select id="studio-speaker-user"><option value="">関連付けなし</option></select></label>
<button id="studio-speaker-apply" type="button">関連付けを保存</button>
</details>
<details id="table-settings"><summary>卓上</summary><label>両面名札<select id="quality-nameplates"><option value="blue">青地・白文字</option><option value="white">白地・青文字</option></select></label></details></section>

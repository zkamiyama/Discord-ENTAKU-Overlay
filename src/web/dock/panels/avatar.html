<dialog aria-labelledby="avatar-editor-title" id="avatar-editor"><form id="avatar-form">
<div class="heading"><h2 id="avatar-editor-title">カスタム画像</h2><span id="avatar-person"></span></div>
<p class="hint">画像の顔をドラッグで囲みます。顔高0.28mを基準に大きさをそろえます。</p>
<canvas aria-label="アバター3Dプレビュー" id="avatar-3d-preview"></canvas><p class="hint">ドラッグで視点を回し、机との位置や背面を確認できます。</p><label for="avatar-file">PNG / 静止WebP</label><input accept="image/png,image/webp" id="avatar-file" type="file"/>
<label>ドラッグで選ぶ範囲<select id="avatar-selection-target"><option value="face">顔</option><option value="frame">撮影範囲（下のチェックを有効にしてください）</option></select></label><canvas aria-label="顔の矩形を指定する画像プレビュー" height="480" id="avatar-preview" width="480"></canvas>
<p class="hint" id="avatar-size"></p>
<div class="avatar-fields"><label>顔の左位置（%）<input id="face-x" max="100" min="0" step="any" type="number"/></label><label>顔の上位置（%）<input id="face-y" max="100" min="0" step="any" type="number"/></label><label>顔の幅（%）<input id="face-w" max="100" min="0.001" step="any" type="number"/></label><label>顔の高さ（%）<input id="face-h" max="100" min="0.001" step="any" type="number"/></label><label>倍率<input id="avatar-scale" max="3" min="0.25" step="0.05" type="number"/></label><label>横位置（m）<input id="avatar-offset-x" max="0.5" min="-0.5" step="0.01" type="number"/></label><label>縦位置（m）<input id="avatar-offset-y" max="0.5" min="-0.5" step="0.01" type="number"/></label></div>
<p class="hint">画像の占有幅に応じて席間隔を拡げます。退出や画像の縮小では机を縮めません。幅は最大2.8mです。</p>
<details><summary>背面画像（省略すると正面画像を減光）</summary><input accept="image/png,image/webp" id="avatar-back-file" type="file"/><canvas aria-label="背面画像の顔矩形" height="480" hidden="" id="avatar-back-preview" width="480"></canvas><div class="avatar-fields"><label>背面の顔の左位置（%）<input id="back-face-x" max="100" min="0" step="any" type="number"/></label><label>背面の顔の上位置（%）<input id="back-face-y" max="100" min="0" step="any" type="number"/></label><label>背面の顔の幅（%）<input id="back-face-w" max="100" min="0" step="any" type="number"/></label><label>背面の顔の高さ（%）<input id="back-face-h" max="100" min="0" step="any" type="number"/></label></div><button id="avatar-back-remove" type="button">背面画像を解除</button></details><details><summary>撮影範囲</summary><label><input id="avatar-frame-enable" type="checkbox"/>人物画像の撮影範囲を指定する</label><div class="avatar-fields"><label>左位置（%）<input id="frame-x" max="100" min="0" step="any" type="number"/></label><label>上位置（%）<input id="frame-y" max="100" min="0" step="any" type="number"/></label><label>幅（%）<input id="frame-w" max="100" min="0" step="any" type="number"/></label><label>高さ（%）<input id="frame-h" max="100" min="0" step="any" type="number"/></label></div><p class="hint">選んだ顔を含む範囲を黄色枠で指定します。画像自体は切り取りません。</p></details>
<p aria-live="polite" id="avatar-feedback" role="status"></p>
<div class="controls"><button disabled="" id="avatar-apply" type="submit">適用</button><button id="avatar-reset" type="button">Discordアイコンへ戻す</button><button id="avatar-cancel" type="button">キャンセル</button></div>
</form></dialog>

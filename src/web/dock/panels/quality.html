<details class="pane" id="quality-panel"><summary>画質</summary><div id="quality-controls"><div class="controls"><button id="quality-low">軽量</button><button id="quality-default">標準</button><button id="quality-high">高画質</button></div>
<div id="render-settings"><label>形状のアンチエイリアス<select id="quality-msaa"><option value="0">なし・軽量</option><option value="4">MSAA 4x（標準）</option><option value="8">MSAA 8x（対応GPUのみ）</option><option value="2">MSAA 2x（軽量）</option></select></label><label>描画解像度<select id="quality-render-scale"><option value="1">100%</option><option value="1.5">150%・スーパーサンプリング</option><option value="2">200%・高負荷</option></select></label><label>影<select id="quality-shadows"><option value="off">なし</option><option value="soft">ソフトシャドウ（PCF）</option></select></label><div class="avatar-fields"><label>影の解像度<select id="quality-shadow-size"><option>512</option><option>1024</option><option>2048</option></select></label><label>影を作る灯数<select id="quality-shadow-lights"><option>1</option><option>2</option><option>4</option><option value="8">8</option></select></label></div>
</div><label><input id="quality-ao" type="checkbox"/>接地感・隙間の影（GTAO）</label><label><input id="quality-reflections" type="checkbox"/>画面内の反射（SSR）</label><label><input id="quality-fxaa" type="checkbox"/>追加の画面平滑化（FXAA）</label><label><input id="quality-gi" type="checkbox"/>間接光・色の回り込み（SSGI・実験的）</label><details><summary>効果の計算と強さ</summary><p class="metadata">SSGIは画面内の1回の拡散反射です。画面外の光は再現しません。人物の色と露出は変更しません。</p>
<label>効果の解像度<select id="quality-scale"><option value="0.5">50%・軽量</option><option value="0.75">75%</option><option value="1">100%・高負荷</option></select></label>
<details><summary>効果の強さ</summary><label>AOの強さ<input id="quality-ao-strength" max="2" min="0" step="0.1" type="number"/></label><label>AOの距離（m）<input id="quality-ao-radius" max="2" min="0.02" step="0.05" type="number"/></label><label>間接光の強さ<input id="quality-gi-strength" max="2" min="0" step="0.1" type="number"/></label><label>間接光の距離（m）<input id="quality-gi-radius" max="5" min="0.1" step="0.1" type="number"/></label><label>反射の強さ<input id="quality-reflection-strength" max="1" min="0" step="0.05" type="number"/></label></details>
</details></div><label>3DGS全体の描画量（Splat数）<input id="gaussian-budget" type="number" min="1000" max="8000000" step="1000" value="500000"/></label><p class="metadata">全員で共有する目安です。左右分割では左右へ配分します。読み込み済みの素材サイズは減りません。</p><label>3DGSの影・反射形状の不透明度閾値<input id="quality-gaussian-alpha" type="number" min="0.01" max="0.99" step="0.01" value="0.3"/></label><p class="metadata">代理メッシュがない素材に使います。小さい値は細い部分を残し、大きい値は薄い部分を除きます。カラー表示は変わりません。</p><p class="metadata" id="quality-status">映像ページの描画待ち</p><p class="metadata">実効サンプル数と影灯数は映像ページの診断で確認できます。</p><p class="error" id="quality-message" role="status"></p></details>

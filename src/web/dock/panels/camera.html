<details class="pane" id="camera-settings"><summary>カメラ設定</summary><label>手動撮影から自動復帰（秒）<input id="camera-return" max="120" min="1" step="1" type="number" value="10"/></label><label>人物の画角（度）<input id="camera-fov" max="35" min="16" step="1" type="number" value="22"/></label><label>ワイド高さ（倍率）<input id="camera-wide-height" max="1" min="0.15" step="0.05" type="number" value="0.3"/></label><p class="metadata">自動OFFは手動固定。画角・高さ・ニアクリップは現在の構図に反映します。</p><p class="error" id="camera-message" role="status"></p><label><input id="camera-split" type="checkbox" checked/>応酬が続く2人を自動で左右分割</label><p class="metadata">隣接席は1カメラ。離れた2人の発話量・交代・重なりで分割します。</p><label>ニアクリップ（m）<input id="camera-near" type="number" min="0.02" max="1" step="0.01" value="0.15"/></label><div class="timing-controls"><label>発話開始の確認（秒）<input id="camera-onset" type="number" min="0.5" max="10" step="0.1" value="1.5"></label><label>無音の終了確認（秒）<input id="camera-end-confirm" type="number" min="0" max="10" step="0.1" value="2.5"></label><label>終了後の切替猶予（秒）<input id="camera-end-grace" type="number" min="0" max="15" step="0.1" value="5"></label><label>主話者の集計期間（秒）<input id="camera-lead-window" type="number" min="3" max="30" step="1" value="10"></label></div><button id="camera-reset" type="button">カメラ設定を初期値に戻す</button><p class="metadata">司会席の後方には回り込みません。無音を終了確認し、その後の猶予が終わるまで構図を保ちます。</p></details>

<!DOCTYPE html>
<html data-theme="dark" lang="ja"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>ENTAKU Dock</title><link href="/static/dock.css" rel="stylesheet"/><script src="/static/dock.js" type="module"></script></head><body>
<div class="preset-bar"><select id="preset-select" aria-label="プリセット"><option value="">現在の設定</option><optgroup label="────────"><option value="__new__">現在の状態を新規プリセットに…</option></optgroup></select><button id="preset-refresh" data-icon="arrow-counter-clockwise" aria-label="プリセット一覧を更新" title="data/presets のJSONを再読み込み"></button></div>
<div class="camera-status" id="camera-status" role="status" aria-live="off"><strong id="composition">全景</strong><span id="camera-transition">CUT</span><span id="reason">接続待ち</span><span id="conversation-leader">主話者なし</span><output id="auto-countdown">接続待ち</output><span class="sr-only" id="shot">WIDE</span><span class="sr-only" id="mode">AUTO</span><span class="sr-only" id="remaining">0秒</span><span class="sr-only" id="foreground"></span><span class="sr-only" id="visibility"></span><span class="sr-only" id="dialogue-state"></span></div>
<p id="preset-feedback" class="preset-feedback" role="status"></p><div class="camera-bar"><div aria-label="カメラ操作" class="segmented"><button aria-label="自動" data-icon="camera" data-label="true" id="auto">自動</button><button aria-label="ワイド" data-icon="arrows-out" id="wide"></button></div></div>
<main class="workspace"><section class="roster-pane"><div class="pane-header"><h2>参加者</h2><span id="counts">—</span><button aria-label="デモ参加者を追加" data-icon="plus" hidden="" id="add"></button></div><div aria-hidden="true" class="roster-columns"><span>席</span><span>名前</span><span>発話</span><span>操作</span></div><div aria-label="参加者一覧" id="participants"></div><div class="roster-footer" id="seat-counts"></div><p class="error" id="error" role="alert"></p>
<section id="vc-chat-panel" aria-labelledby="vc-chat-title"><div class="pane-header"><h2 id="vc-chat-title">VC-CHAT</h2><span id="vc-chat-count">0件</span><button id="vc-chat-copy" type="button" data-icon="copy" aria-label="表示中のチャットをコピー" title="表示中のチャットをコピー"></button></div><p id="vc-chat-status" class="chat-status" role="status">接続待ち</p><div id="vc-chat-messages" role="log" aria-label="VC内蔵チャット" aria-live="polite" aria-relevant="additions text" tabindex="0"></div><p id="vc-chat-empty" class="chat-empty">参加中VCの投稿をここに表示します。</p><button id="vc-chat-latest" type="button" hidden>新着を見る ↓</button><p class="chat-note">起動後の投稿 · 最大100件 · 保存なし</p><p id="vc-chat-feedback" class="chat-status" role="status"></p></section></section>
<aside class="inspector"><!-- @include panels/studio.html --><!-- @include panels/camera.html --><!-- @include panels/exposure.html --><!-- @include panels/connection.html --><!-- @include panels/quality.html --><!-- @include panels/post.html --><!-- @include panels/diagnostics.html --></aside></main>
<footer class="statusbar"><span id="transport" role="status">接続中</span><span id="connection">—</span><div class="title-actions"><a aria-label="映像ページを開く" data-icon="arrow-square-out" id="open-overlay" rel="noopener noreferrer" target="_blank"></a><button aria-label="OBS用URLをコピー" data-icon="copy" id="copy"></button><label class="theme-control"><span class="sr-only">外観</span><select aria-label="外観" id="theme"><option value="system">システム</option><option value="light">ライト</option><option value="dark">ダーク</option></select></label></div></footer>
<!-- @include panels/avatar.html --><!-- @include panels/presets.html --></body></html>
